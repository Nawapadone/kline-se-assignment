server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the version to anyone probing the server.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app routes client-side: /pin and /main are not files on disk, so every
    # unmatched path has to return index.html or a reload lands on a 404.
    # nginx drops inherited add_header as soon as a location sets its own, so
    # every location includes the one shared list.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html names the current bundles, so it must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
