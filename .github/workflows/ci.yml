name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run check:real-bundle
      - run: bun run build-storybook

      # The end-to-end suite starts its own dev servers, so only the browser is missing.
      - run: bunx playwright install --with-deps chromium

      # An explicit host: `localhost` can resolve to ::1 while curl and the runner try 127.0.0.1.
      - run: |
          bunx vite preview --outDir storybook-static --host 127.0.0.1 --port 6006 --strictPort &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:6006 > /dev/null
          bun run test-storybook --url http://127.0.0.1:6006

      - run: bun run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t kline-frontend .
      - run: docker run -d --rm -p 8080:8080 --name kline-frontend kline-frontend

      # Locations with their own add_header drop inherited ones, so check a
      # route that falls through to index.html as well as the root.
      - run: |
          for path in / /pin; do
            headers=$(curl -sfI --retry 10 --retry-all-errors --retry-connrefused --retry-delay 1 "http://localhost:8080$path")
            echo "$headers" | grep -qi '^content-security-policy:'
            echo "$headers" | grep -qi '^x-frame-options:'
          done
